name: Build and Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1
      - uses: actions/setup-dotnet@v4.4.0
        with:
          dotnet-version: '8.0.x'
      - run: dotnet --info
      - run: dotnet restore --verbosity detailed
      - run: dotnet build --configuration Release --no-restore --verbosity detailed
      - run: |
          mkdir -p ${{ github.workspace }}/plugin
          cp bin/Release/net8.0/Imageprovider.dll ${{ github.workspace }}/plugin/
      - id: checksum
        run: |
          CHECKSUM=$(sha256sum ${{ github.workspace }}/plugin/Imageprovider.dll | awk '{print $1}')
          echo "checksum=$CHECKSUM" >> $GITHUB_OUTPUT
      - run: |
          TAG=${GITHUB_REF_NAME}
          VERSION=${TAG#v}
          CHECKSUM="${{ steps.checksum.outputs.checksum }}"
          sed -i "s|\"version\": \".*\"|\"version\": \"$VERSION.0\"|" manifest.json
          sed -i "s|\"downloadUrl\": \".*\"|\"downloadUrl\": \"https://github.com/${{ github.repository }}/releases/download/$TAG/Imageprovider.dll\"|" manifest.json
          sed -i "s|SHA256_PLACEHOLDER|$CHECKSUM|" manifest.json
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add manifest.json
          git commit -m "Update manifest for ${{ github.ref_name }}" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }}
      - uses: softprops/action-gh-release@v2.1.0
        with:
          files: |
            ${{ github.workspace }}/plugin/Imageprovider.dll
          fail_on_unmatched_files: true
